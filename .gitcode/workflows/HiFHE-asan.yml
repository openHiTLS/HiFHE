name: HiFHE-asan-gate

on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - open
      - update
      - reopen
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  asan-gate:
    name: ASan gate (Provider ${{ matrix.provider }})
    runs-on: [ubuntu-latest, x64, medium]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        provider: [enable, disable]
    env:
      HIFHE_PROVIDER_MODE: ${{ matrix.provider }}
      HITLS_SOURCE_DIR: .ci/openhitls
      HITLS_BUILD_DIR: .ci/openhitls/build
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1:symbolize=1
      LSAN_OPTIONS: exitcode=99

    steps:
      - name: Checkout
        uses: checkout

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p .ci artifacts

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            cmake \
            git \
            python3

      - name: Clone openHiTLS
        run: |
          set -euo pipefail
          git clone --depth 1 --branch openhitls-0.4.0-alpha8 \
            https://gitcode.com/openHiTLS/openhitls.git "$HITLS_SOURCE_DIR"
          git -C "$HITLS_SOURCE_DIR" log -1 --oneline

      - name: Build openHiTLS
        run: |
          set -euo pipefail
          {
            cmake \
              -S "$HITLS_SOURCE_DIR" \
              -B "$HITLS_BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DHITLS_BUILD_PROFILE=full \
              -DHITLS_BUILD_STATIC=OFF \
              -DHITLS_BUILD_SHARED=ON \
              -DHITLS_CRYPTO_RAND_CB=ON \
              -DHITLS_CRYPTO_DRBG_GM=ON
            cmake --build "$HITLS_BUILD_DIR" --parallel "$(nproc)"
            test -f "$HITLS_BUILD_DIR/libhitls_bsl.so"
            test -f "$HITLS_BUILD_DIR/libhitls_crypto.so"
          } 2>&1 | tee artifacts/openhitls-build.log

      - name: Build HiFHE with ASan
        run: |
          set -euo pipefail
          bash testcode/script/build_hifhe.sh debug asan \
            "--${HIFHE_PROVIDER_MODE}" provider \
            --hitls_dir "$PWD/$HITLS_SOURCE_DIR" \
            2>&1 | tee artifacts/hifhe-asan-build.log
          test -f build/libhifhe.so
          readelf -d build/libhifhe.so | grep -F 'libasan.so'
          nm -D build/libhifhe.so | grep -F '__asan_init'

      - name: Build SDV with ASan
        run: |
          set -euo pipefail
          bash testcode/script/build_sdv.sh asan \
            2>&1 | tee artifacts/sdv-asan-build.log
          ctest --test-dir build --show-only=json-v1 -L sdv > artifacts/sdv-tests.json
          python3 - <<'PY' > artifacts/sdv-binaries.txt
          import json
          with open('artifacts/sdv-tests.json') as data:
              for test in json.load(data)['tests']:
                  print(test['command'][0])
          PY
          test -s artifacts/sdv-binaries.txt
          while IFS= read -r suite_bin; do
            test -x "$suite_bin"
            readelf -d "$suite_bin" | grep -F 'libasan.so'
          done < artifacts/sdv-binaries.txt

      - name: Run SDV with ASan
        run: |
          set -euo pipefail
          ctest --test-dir build --verbose --output-on-failure --no-tests=error -L sdv \
            2>&1 | tee artifacts/sdv-asan.log

      - name: Verify sanitizer logs
        run: |
          set -euo pipefail
          if grep -ER \
            'ERROR: (AddressSanitizer|LeakSanitizer)|SUMMARY: (AddressSanitizer|LeakSanitizer)|runtime error:|DEADLYSIGNAL' \
            artifacts; then
            echo "Sanitizer error found in gate logs" >&2
            exit 1
          fi
