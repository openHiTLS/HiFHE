name: ASan

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - open
      - update
      - reopen
    branches:
      - main
  workflow_dispatch:

permissions:
  repository: read

defaults:
  run:
    shell: bash

jobs:
  asan-gate:
    name: ASan
    runs-on: [ubuntu-latest, x64, medium]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        int128: [enable, disable]
    env:
      HIFHE_INT128_MODE: ${{ matrix.int128 }}
      HITLS_SOURCE_DIR: .ci/openhitls
      HITLS_BUILD_DIR: .ci/openhitls/build
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1:symbolize=1
      LSAN_OPTIONS: exitcode=99

    steps:
      - name: Checkout
        uses: checkout
        with:
          repository: >-
            https://gitcode.com/${{ atomgit.event.pull_request.head.repo.full_name || atomgit.repository }}.git
          ref: ${{ atomgit.event.pull_request.head.sha || atomgit.sha }}

      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ atomgit.event.pull_request.head.sha || atomgit.sha }}
        run: |
          set -euo pipefail
          git log -1 --format='%H %s'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p .ci artifacts

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            cmake \
            git \
            python3

      - name: Clone openHiTLS
        run: |
          set -euo pipefail
          git clone --depth 1 --branch openhitls-0.4.0-alpha8 \
            https://gitcode.com/openHiTLS/openhitls.git "$HITLS_SOURCE_DIR"
          git -C "$HITLS_SOURCE_DIR" log -1 --oneline

      - name: Build openHiTLS
        run: |
          set -euo pipefail
          {
            cmake \
              -S "$HITLS_SOURCE_DIR" \
              -B "$HITLS_BUILD_DIR" \
              -DCMAKE_BUILD_TYPE=Debug \
              -DHITLS_BUILD_PROFILE=full \
              -DHITLS_BUILD_STATIC=OFF \
              -DHITLS_BUILD_SHARED=ON \
              -DHITLS_CRYPTO_RAND_CB=ON \
              -DHITLS_CRYPTO_DRBG_GM=ON
            cmake --build "$HITLS_BUILD_DIR" --parallel "$(nproc)"
            test -f "$HITLS_BUILD_DIR/libhitls_bsl.so"
            test -f "$HITLS_BUILD_DIR/libhitls_crypto.so"
          } 2>&1 | tee artifacts/openhitls-build.log

      - name: Build SDV with ASan
        run: |
          set -euo pipefail
          HITLS_ROOT_DIR="$PWD/$HITLS_SOURCE_DIR" bash testcode/script/build_sdv.sh debug asan \
            --enable err --enable custom-param --enable provider \
            "--${HIFHE_INT128_MODE}" int128 \
            2>&1 | tee artifacts/sdv-asan-build.log
          readelf -d testcode/build/libhifhe.so | grep -F 'libasan.so'
          nm -D testcode/build/libhifhe.so | grep -F '__asan_init'
          find testcode/output/demo -maxdepth 1 -type f -executable -print \
            > artifacts/test-binaries.txt
          test -s artifacts/test-binaries.txt
          find testcode/output -maxdepth 1 -type f -executable -name 'test_suite*' -print \
            >> artifacts/test-binaries.txt
          while IFS= read -r test_bin; do
            readelf -d "$test_bin" | grep -F 'libasan.so'
          done < artifacts/test-binaries.txt

      - name: Run SDV and demos with ASan
        run: |
          set -euo pipefail
          bash testcode/script/execute_sdv.sh \
            2>&1 | tee artifacts/sdv-asan.log

      - name: Verify sanitizer logs
        run: |
          set -euo pipefail
          if grep -ER \
            'ERROR: (AddressSanitizer|LeakSanitizer)|SUMMARY: (AddressSanitizer|LeakSanitizer)|runtime error:|DEADLYSIGNAL' \
            artifacts; then
            echo "Sanitizer error found in gate logs" >&2
            exit 1
          fi

  mini-test:  
    name: Mini test
    runs-on: [ubuntu-latest, x64, medium]
    timeout-minutes: 60
    env:
      HITLS_SOURCE_DIR: .ci/openhitls
      HITLS_BUILD_DIR: .ci/openhitls/build
    steps:
      - name: Checkout
        uses: checkout
        with:
          repository: >-
            https://gitcode.com/${{ atomgit.event.pull_request.head.repo.full_name || atomgit.repository }}.git
          ref: ${{ atomgit.event.pull_request.head.sha || atomgit.sha }}

      - name: Prepare workspace
        run: mkdir -p .ci artifacts

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git python3

      - name: Clone openHiTLS
        run: |
          set -euo pipefail
          git clone --depth 1 --branch openhitls-0.4.0-alpha8 \
            https://gitcode.com/openHiTLS/openhitls.git "$HITLS_SOURCE_DIR"

      - name: Build openHiTLS
        run: |
          set -euo pipefail
          cmake \
            -S "$HITLS_SOURCE_DIR" \
            -B "$HITLS_BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DHITLS_BUILD_PROFILE=full \
            -DHITLS_BUILD_STATIC=OFF \
            -DHITLS_BUILD_SHARED=ON \
            -DHITLS_CRYPTO_RAND_CB=ON \
            -DHITLS_CRYPTO_DRBG_GM=ON
          cmake --build "$HITLS_BUILD_DIR" --parallel "$(nproc)"
          test -f "$HITLS_BUILD_DIR/libhitls_bsl.so"
          test -f "$HITLS_BUILD_DIR/libhitls_crypto.so"

      - name: Run mini feature trim tests
        run: |
          set -euo pipefail
          bash testcode/script/mini_test.sh \
            --hitls_dir "$PWD/$HITLS_SOURCE_DIR" \
            2>&1 | tee artifacts/mini-test.log
